# INFRA-AGAIN Backend — Fly.io Deployment
# Build: fly deploy
# Config: fly.toml (auto-generated by `fly launch`)

app = "infra-again"
primary_region = "sin"  # Singapore — ใกล้ไทยสุด

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  INFRA_AGAIN_DB_PATH = "/data/infra-again.db"
  INFRA_AGAIN_EVIDENCE_DIR = "/data/infra-runs"

[[services]]
  protocol = "tcp"
  internal_port = 8080
  processes = ["app"]

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]
    force_https = false

  [[services.http_checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"
    method = "get"
    path = "/health"
    protocol = "http"

[mounts]
  source = "infra_again_data"
  destination = "/data"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
