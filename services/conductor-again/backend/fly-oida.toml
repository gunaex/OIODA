# Conductor Again — Fly.io Configuration
app = "oida-conductor"
primary_region = "sin"

[build]

[env]
  ACCOUNT_AGAIN_URL = 'http://oida-account.internal:8001/api/v1'
  ACCOUNT_AGAIN_ISSUER = 'https://api-oida.kanphong.com'
  ADMIN_EMAIL = 'owner@oida.local'

[mounts]
  source = "conductor_data"
  destination = "/app/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/api/health"
    interval = "30s"
    timeout = "5s"

[vm]
  size = "shared-cpu-1x"
  memory = "256mb"
