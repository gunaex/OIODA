app = "oida-document"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  AUTH_MODE = "local"
  ACCOUNT_AGAIN_URL = "http://oida-account.internal:8001"
  DATABASE_URL = "sqlite:////data/document-again.db"

[mounts]
  source = "document_data"
  destination = "/data"
  initial_size = "1gb"

[http_service]
  internal_port = 8003
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/api/health"

[vm]
  size = "shared-cpu-1x"
