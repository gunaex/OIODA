# fly.toml app configuration for qa-again-backend.
# See https://fly.io/docs/reference/configuration/

app = 'qa-again-backend'
primary_region = 'sin'

[build]
[env]
  DATA_DIR = '/app/data'

[[mounts]]
  source = 'qa_again_data'
  destination = '/app/data'
  initial_size = '1gb'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
  cpus = 1
  memory_mb = 256
