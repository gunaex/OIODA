# Placeholder app name — change this to your actual Fly.io app name before
# deploying (fly.toml is generated per-app; this one is just prep).
app = "pmo-platform-backend"
primary_region = "sin" # Singapore — lowest latency for users in Thailand

[build]

[env]
  # NOTE: mounted at /app/data (the parent folder), not /app/data/projects.
  # master.db (the project registry) lives at /app/data/master.db and each
  # project's SQLite file at /app/data/projects/{slug}.db — both need to
  # survive redeploys, so the whole parent folder is what's mounted, not
  # just the projects/ subfolder.
  DATA_DIR = "/app/data"

[[mounts]]
  source = "pmo_data"
  destination = "/app/data"
  initial_size = "1gb"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
